<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HUMO MAKES — Букит, Нуса-Дуа</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <section id="stage" aria-label="Карта острова">
      <canvas id="world" width="896" height="588"></canvas>
      <div id="thingTag" hidden>
        <strong id="tagTitle"></strong>
        <span id="tagNeed"></span>
      </div>
    </section>

    <header id="chrome">
      <p id="dayLine">День 0</p>
      <div class="chrome-actions">
        <button id="btnPause" type="button">Пауза</button>
        <button id="speedBtn" type="button" aria-describedby="rateLine">Час</button>
        <span id="rateLine" class="sr-only"></span>
        <div class="zoom" role="group" aria-label="Масштаб">
          <button id="zoomOut" type="button" aria-label="Дальше">−</button>
          <span id="zoomLabel">вся карта</span>
          <button id="zoomIn" type="button" aria-label="Ближе">+</button>
        </div>
        <button id="btnReset" type="button">Новый мир</button>
      </div>
    </header>

    <section id="visor" hidden aria-label="Вид из глаз">
      <canvas id="eyes" width="640" height="360" aria-label="Руки и земля перед глазами"></canvas>
      <div class="visor-copy">
        <p id="eyeKicker">Его глазами</p>
        <h2 id="eyeName"></h2>
        <p id="eyeDoing"></p>
        <button type="button" id="eyeWho" hidden></button>
      </div>
    </section>

    <nav id="summon" aria-label="Разделы">
      <button type="button" data-sheet="missions" aria-pressed="false">Миссии</button>
      <button type="button" data-sheet="eyes" aria-pressed="false">Глаза</button>
      <button type="button" data-sheet="people" aria-pressed="false">Люди</button>
      <button type="button" data-sheet="island" aria-pressed="false">Остров</button>
    </nav>

    <section id="sheet" hidden aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <h2 id="sheetTitle">Миссии</h2>
        <button type="button" id="sheetClose">Закрыть</button>
      </div>
      <div id="sheetMissions"></div>
      <div id="sheetPeople" hidden></div>
      <div id="sheetIsland" hidden>
        <div id="islandQuests"></div>
        <div id="hamletList"></div>
        <p id="islandLine" class="hint"></p>
        <button id="btnChronicle" type="button" aria-expanded="false" aria-controls="chronicle">Хроника</button>
      </div>
    </section>
  </div>

  <div id="chronicle" hidden>
    <div class="veil" data-close></div>
    <div class="board" role="dialog" aria-modal="true" aria-labelledby="chronicleTitle">
      <div class="board-head">
        <div>
          <p class="chronicle-kicker">HUMO</p>
          <h2 id="chronicleTitle">Хроника мира</h2>
        </div>
        <button type="button" id="chronicleClose">Закрыть</button>
      </div>
      <div id="sundial"></div>
      <div id="lenses" role="tablist" aria-label="Категории"></div>
      <div id="eventFilters" hidden></div>
      <div id="chronicleBody" role="tabpanel"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
